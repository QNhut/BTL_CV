name: rtdetrv2_r101_fruit_pretrained
type: rtdetrv2
family: detection
mode: pretrained
protocol: external_fruit_pretrained
model:
  hub_id: MohamedKhayat/fruit-detector-rtdetrv2-101
  revision: main
  target_labels: [Apple]  # MinneApple; do not count unrelated vegetable classes.
  device: null
inference:
  min_score: 0.05
  count_threshold: 0.5
  nms_iou: 0.5
  tile: {enabled: false, size: 640, overlap: 0.2}
# To fine-tune, change mode to finetune, protocol to finetuned, and use a new name.
train:
  epochs: 40
  batch_size: 2
  num_workers: 2
  optimizer: adamw
  lr: 0.00001
  weight_decay: 0.0001
  scheduler: cosine
  warmup_epochs: 1
  grad_clip: 1.0
  amp: true
  val_every: 1
  patience: 10
  seed: 42
